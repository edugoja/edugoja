name: Update stats card

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stats SVG
        run: node stats/generate-stats.js ${{ github.repository_owner }}
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add edugoja-github-stats.svg
          git diff --cached --quiet || git commit -m "chore: update stats card"
          git push
