
    <svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
        <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">
                <style>
                    .container {
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                        background-color: #212830;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 16px;
                        width: 366px; /* 400 - 2*16 - 2*1 */
                        height: 216px; /* 200 - 2*16 - 2*1 */
                        display: flex;
                        flex-direction: column;
                        justify-content: space-between;
                    }
                    h3 {
                        margin: 0;
                        font-size: 18px;
                        color: #4493f8;
                    }
                    .stats-grid {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 16px;
                        font-size: 14px;
                        color: #586069;
                    }
                    .stat-item h4 {
                        margin: 0 0 4px 0;
                        font-size: 12px;
                        font-weight: 500;
                        text-transform: uppercase;
                    }
                    .stat-item p {
                        margin: 0;
                        font-size: 20px;
                        font-weight: 600;
                        color: #ccc;
                    }
                    .languages-title {
                        font-size: 12px;
                        font-weight: 500;
                        text-transform: uppercase;
                        color: #586069;
                        margin-bottom: 8px;
                    }
                </style>
                <div class="container">
                    <h3>GitHub Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <h4>Total Stars</h4>
                            <p>4</p>
                        </div>
                        <div class="stat-item">
                            <h4>Total Commits (Last Year)</h4>
                            <p>433</p>
                        </div>
                    </div>
                     <div>
                        <h4 class="languages-title">Top Languages</h4>
                        <div style="font-size: 12px; color: #ccc;">
                           
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #b07219; border-radius: 50%; margin-right: 8px;"></div>
            <span>Java</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #178600; border-radius: 50%; margin-right: 8px;"></div>
            <span>C#</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #f1e05a; border-radius: 50%; margin-right: 8px;"></div>
            <span>JavaScript</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #3572A5; border-radius: 50%; margin-right: 8px;"></div>
            <span>Python</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #e34c26; border-radius: 50%; margin-right: 8px;"></div>
            <span>HTML</span>
        </div>
    
                        </div>
                    </div>
                </div>
            </div>
        </foreignObject>
    </svg>
    