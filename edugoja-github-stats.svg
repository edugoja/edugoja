
    <svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
        <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">
                <style>
                    .container {
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                        background-color: #0d1117;
                        border: 1px solid #30363d;
                        border-radius: 8px;
                        padding: 20px;
                        width: 358px; /* 400 - 2*20 - 2*1 */
                        height: 208px; /* 250 - 2*20 - 2*1 */
                        display: flex;
                        flex-direction: column;
                    }
                    h3 {
                        margin: 0;
                        font-size: 18px;
                        color: #58a6ff;
                    }
                    .content-body {
                        display: flex;
                        flex-direction: row;
                        gap: 24px;
                        margin-top: 20px;
                        flex-grow: 1;
                    }
                    .column-left {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                    }
                    .column-right {
                        flex: 1.2;
                        display: flex;
                        flex-direction: column;
                    }
                    .stat-item h4 {
                        margin: 0 0 4px 0;
                        font-size: 12px;
                        font-weight: 500;
                        text-transform: uppercase;
                        color: #8b949e;
                    }
                    .stat-item p {
                        margin: 0;
                        font-size: 32px;
                        font-weight: 700;
                        color: #f0f6fc;
                    }
                    .stat-desc {
                        font-size: 11px;
                        color: #8b949e;
                        margin-top: 4px;
                    }
                    .languages-title {
                        font-size: 12px;
                        font-weight: 500;
                        text-transform: uppercase;
                        color: #8b949e;
                        margin-bottom: 8px;
                        margin-top: 0;
                    }
                </style>
                <div class="container">
                    <h3>GitHub Stats</h3>
                    <div class="content-body">
                        <div class="column-left">
                            <div class="stat-item">
                                <h4>Total Commits</h4>
                                <p>1059</p>
                                <div class="stat-desc">In the last year</div>
                            </div>
                        </div>
                        <div class="column-right">
                            <h4 class="languages-title">Top Languages</h4>
                            <div style="font-size: 12px; color: #c9d1d9;">
                                
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #b07219; border-radius: 50%; margin-right: 8px;"></div>
            <span>Java</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #00B4AB; border-radius: 50%; margin-right: 8px;"></div>
            <span>Dart</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #178600; border-radius: 50%; margin-right: 8px;"></div>
            <span>C#</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #3572A5; border-radius: 50%; margin-right: 8px;"></div>
            <span>Python</span>
        </div>
    
        <div style="display: flex; align-items: center; margin-bottom: 4px;">
            <div style="width: 10px; height: 10px; background-color: #f1e05a; border-radius: 50%; margin-right: 8px;"></div>
            <span>JavaScript</span>
        </div>
    
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </foreignObject>
    </svg>
    